<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function abc()
        {
            var a=document.f.t1.value;
            var b=document.f.t2.value;
            var c=parseInt(a)+parseInt(b);
            document.write(c)
        }
    </script>
</head>
<body>
    <form name="f">
        Enter 1st no:<input type="text" id="t1">
        Enter 2nd no:<input type="text" id="t2">
        <input type="submit" value="add" onclick="abc()">
    </form>
</body>
</html>
